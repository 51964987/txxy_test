services:
  web:
    build: .
    command: ["bash", "docker/entrypoint.sh"]
    ports:
      - "8088:8088"
    env_file: .env
    volumes:
      - txxy_db:/app/db
      - txxy_outputs:/app/outputs
      - txxy_downloads:/app/downloads
    restart: unless-stopped

  cron:
    build: .
    command: ["bash", "docker/entrypoint_cron.sh"]
    env_file: .env
    volumes:
      - txxy_db:/app/db
      - txxy_outputs:/app/outputs
      - txxy_downloads:/app/downloads
    restart: unless-stopped

# 备用方案: 数据目录使用 Docker 命名卷(不共用宿主机 ./db 等目录, 与本地现有数据隔离)。
# 启用方式: docker compose -f docker-compose.named-volumes.yml up -d --build
# 数据迁移: 见 docs/Docker部署方案.md 第 7 节方式三(命名卷 cp)
volumes:
  txxy_db:
  txxy_outputs:
  txxy_downloads:
